
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Грибная Империя 🍄</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; padding: 0; height: 100vh;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #0d1410; color: #fff;
    display: flex; overflow: hidden; position: relative;
  }

  #particleCanvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  /* ВЕРХНИЕ КНОПКИ */
  .top-controls {
    position: absolute; top: 15px; right: 15px;
    display: flex; gap: 10px; z-index: 100;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; backdrop-filter: blur(5px);
  }
  .icon-btn:hover { background: rgba(255,255,255,0.2); }

  /* ПЛАШКА ПРИМЕРКИ */
  #previewBadge {
    position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
    background: rgba(79, 195, 247, 0.9); color: #000; padding: 5px 15px;
    border-radius: 15px; font-weight: bold; font-size: 14px;
    display: none; z-index: 15; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } 100% { transform: translateX(-50%) scale(1); } }

  /* БАННЕР ИВЕНТА */
  #eventBanner {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, rgba(255, 213, 79, 0.95), rgba(255, 143, 0, 0.95));
    color: #000; padding: 10px 20px; border-radius: 20px;
    font-weight: 900; font-size: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    z-index: 150; opacity: 0; transition: all 0.3s; pointer-events: none;
    text-align: center; display: flex; flex-direction: column; align-items: center;
  }
  #eventBanner.active { opacity: 1; transform: translateX(-50%) translateY(0); }
  #eventTimer { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  /* БОСС ИНТЕРФЕЙС */
  #bossContainer {
    position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center; z-index: 15;
    width: 90%; max-width: 400px;
  }
  #bossContainer.active { display: flex; animation: appear 0.5s ease-out; }
  .boss-title { font-size: 20px; font-weight: 900; color: #ff5252; text-shadow: 0 0 10px #000; margin-bottom: 5px; }
  .boss-hp-bar-bg {
    width: 100%; height: 25px; background: rgba(0,0,0,0.7); border-radius: 15px; border: 2px solid #ff5252;
    overflow: hidden; position: relative;
  }
  .boss-hp-bar-fill {
    height: 100%; width: 100%; background: linear-gradient(90deg, #ff5252, #ff1744);
    transition: width 0.1s linear;
  }
  .boss-hp-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000;
  }
  #bossTimerText { font-size: 14px; color: #ffd54f; font-weight: bold; margin-top: 5px; text-shadow: 0 0 5px #000; }
  
  /* МОДАЛЬНЫЕ ОКНА */
  .modal-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(5px);
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: #141e18; border: 2px solid #23352b; border-radius: 16px;
    padding: 20px; width: 90%; max-width: 450px; text-align: center;
    max-height: 85vh; display: flex; flex-direction: column;
  }
  .modal-content h3 { margin: 0 0 15px 0; color: #a5d6a7; }
  
  .modal-scroll { overflow-y: auto; flex-grow: 1; margin-bottom: 15px; padding-right: 5px; }
  .modal-scroll::-webkit-scrollbar { width: 6px; }
  .modal-scroll::-webkit-scrollbar-thumb { background: #4fc3f7; border-radius: 3px; }

  .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; }
  .toggle-btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-family: inherit; }
  .toggle-on { background: #4caf50; color: #fff; }
  .toggle-off { background: #555; color: #aaa; }
  
  .close-modal-btn { width: 100%; padding: 12px; border-radius: 8px; background: #4fc3f7; color: #000; font-weight: bold; border: none; cursor: pointer; }

  /* ДОСТИЖЕНИЯ */
  .achievement-item {
    background: rgba(255,255,255,0.05); border: 1px solid #23352b; border-radius: 10px;
    padding: 12px; margin-bottom: 10px; text-align: left; display: flex; align-items: center; gap: 10px; opacity: 0.6;
  }
  .achievement-item.unlocked { opacity: 1; border-color: #4caf50; background: rgba(76, 175, 80, 0.1); }
  .ach-icon { font-size: 24px; }
  .ach-info { flex-grow: 1; }
  .ach-name { font-weight: bold; font-size: 15px; }
  .ach-desc { font-size: 12px; color: #a5d6a7; }
  .ach-progress { font-size: 12px; color: #ffd54f; font-weight: bold; margin-top: 4px; }

  /* СУНДУКИ */
  .chest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chest-card {
    background: rgba(255,255,255,0.05); border: 2px solid #23352b; border-radius: 12px;
    padding: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    transition: 0.2s; position: relative; overflow: hidden;
  }
  .chest-card:hover { transform: translateY(-2px); }
  .chest-card.cant-buy { opacity: 0.5; cursor: not-allowed; }
  .chest-card.cant-buy:hover { transform: none; }
  
  .chest-icon { font-size: 40px; margin-bottom: 5px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
  .chest-name { font-weight: bold; font-size: 14px; margin-bottom: 5px; text-align: center; }
  .chest-cost { font-size: 14px; color: #4fc3f7; font-weight: 900; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 10px; }
  
  .chest-common { border-color: #795548; }
  .chest-uncommon { border-color: #4caf50; background: rgba(76, 175, 80, 0.05); }
  .chest-rare { border-color: #2196f3; background: rgba(33, 150, 243, 0.05); }
  .chest-epic { border-color: #9c27b0; background: rgba(156, 39, 176, 0.05); }
  .chest-legendary { border-color: #ff9800; background: rgba(255, 152, 0, 0.05); }
  .chest-mythic { border-color: #f44336; background: rgba(244, 67, 54, 0.1); box-shadow: 0 0 15px rgba(244, 67, 54, 0.3); }

  /* ПАНЕЛИ */
  .panel { background: #141e18; display: flex; flex-direction: column; width: 320px; flex-shrink: 0; z-index: 20; }
  .panel-header { padding: 15px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #23352b; text-align: center; display: flex; justify-content: space-between; align-items: center; }
  .panel-header h2 { margin: 0; font-size: 18px; color: #a5d6a7; letter-spacing: 1px; }
  
  #buyModeBtn { background: #4fc3f7; color: #000; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
  
  .list-container { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .list-container::-webkit-scrollbar { width: 6px; }
  .list-container::-webkit-scrollbar-thumb { background: #4fc3f7; border-radius: 3px; }

  .left-panel { border-right: 2px solid #23352b; }
  .right-panel { border-left: 2px solid #23352b; width: 360px; }

  /* ЦЕНТР */
  .center-panel {
    flex-grow: 1; display: flex; flex-direction: column; 
    background: radial-gradient(circle at 50% 30%, #1e3c2c 0%, #0a1c12 80%);
    position: relative; align-items: center; justify-content: center; z-index: 5;
  }

  .header { text-align: center; z-index: 10; position: absolute; top: 20px; width: 100%; }
  .score { font-size: 52px; font-weight: 900; margin: 0; color: #4fc3f7; text-shadow: 0 0 25px rgba(79, 195, 247, 0.4); }
  .stats { font-size: 15px; color: #a5d6a7; margin-top: 5px; font-weight: bold; }
  .stats span { color: #fff; }

  .mushroom-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }

  #clickBtn {
    width: 280px; height: 350px; cursor: pointer;
    transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
    filter: drop-shadow(0 25px 35px rgba(0,0,0,0.6));
    z-index: 5; border: none; background: none; padding: 0; outline: none;
  }
  #clickBtn:active { transform: scale(0.93); }
  
  #goldenDrop {
    position: absolute; font-size: 60px; cursor: pointer;
    filter: drop-shadow(0 0 25px #ffd54f);
    display: none; z-index: 10; animation: float 2s infinite alternate;
  }
  @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }

  /* АНИМАЦИИ СВЕЧЕНИЯ */
  @keyframes auraFire {
    0% { filter: drop-shadow(0 0 15px rgba(255, 87, 34, 0.6)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    50% { filter: drop-shadow(0 0 35px rgba(255, 152, 0, 0.9)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    100% { filter: drop-shadow(0 0 15px rgba(255, 87, 34, 0.6)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
  }
  @keyframes auraRadio {
    0% { filter: drop-shadow(0 0 10px rgba(118, 255, 3, 0.4)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    50% { filter: drop-shadow(0 0 40px rgba(118, 255, 3, 0.8)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    100% { filter: drop-shadow(0 0 10px rgba(118, 255, 3, 0.4)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
  }
  @keyframes auraVoid {
    0% { filter: drop-shadow(0 0 20px rgba(156, 39, 176, 0.6)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    50% { filter: drop-shadow(0 0 50px rgba(156, 39, 176, 0.9)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    100% { filter: drop-shadow(0 0 20px rgba(156, 39, 176, 0.6)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
  }
  @keyframes auraIce {
    0% { filter: drop-shadow(0 0 15px rgba(79, 195, 247, 0.5)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    50% { filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.8)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    100% { filter: drop-shadow(0 0 15px rgba(79, 195, 247, 0.5)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
  }
  @keyframes auraHypno {
    0% { filter: drop-shadow(0 0 15px rgba(41, 121, 255, 0.5)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    50% { filter: drop-shadow(0 0 35px rgba(0, 229, 255, 0.8)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    100% { filter: drop-shadow(0 0 15px rgba(41, 121, 255, 0.5)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
  }
  @keyframes auraGold {
    0% { filter: drop-shadow(0 0 15px rgba(255, 193, 7, 0.6)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    50% { filter: drop-shadow(0 0 40px rgba(255, 235, 59, 0.9)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
    100% { filter: drop-shadow(0 0 15px rgba(255, 193, 7, 0.6)) drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
  }

  .aura-fire { animation: auraFire 1.5s infinite; }
  .aura-radio { animation: auraRadio 2s infinite; }
  .aura-void { animation: auraVoid 2.5s infinite; }
  .aura-ice { animation: auraIce 2s infinite; }
  .aura-hypno { animation: auraHypno 1.8s infinite; }
  .aura-gold { animation: auraGold 1.5s infinite; }

  /* КАРТОЧКИ */
  .item-card {
    background: rgba(255,255,255,0.03); border: 1px solid #23352b; border-radius: 10px;
    padding: 12px; color: #fff; display: flex; justify-content: space-between; align-items: center;
    transition: all 0.2s; flex-shrink: 0; position: relative;
  }
  .item-card.can-buy { border-color: #4caf50; cursor: pointer; }
  .item-card.can-buy:active { transform: scale(0.98); background: rgba(76, 175, 80, 0.1); }
  .item-card.cant-buy { opacity: 0.6; }
  .item-card.equipped { border-color: #4fc3f7; background: rgba(79,195,247,0.1); box-shadow: 0 0 10px rgba(79,195,247,0.2); }
  
  .item-info { display: flex; flex-direction: column; gap: 3px; max-width: 55%; pointer-events: none; }
  .item-name { font-weight: bold; font-size: 15px; }
  .item-desc { font-size: 11px; color: #a5d6a7; line-height: 1.3; }
  
  .item-right { text-align: right; display: flex; flex-direction: row; align-items: center; gap: 5px; }
  .item-cost { font-weight: 900; color: #4fc3f7; font-size: 15px; pointer-events: none; }
  .item-count { font-size: 12px; color: #ffd54f; font-weight: bold; pointer-events: none;}
  
  .skin-btn { padding: 5px 10px; border-radius: 6px; border: none; font-weight: bold; font-family: inherit; font-size: 12px; cursor: pointer; color: #fff; transition: 0.1s; }
  .skin-btn.buy { background: #4caf50; }
  .skin-btn.equip { background: #4fc3f7; color: #000; }
  .skin-btn.equipped { background: transparent; color: #4fc3f7; border: 1px solid #4fc3f7; cursor: default; }
  .skin-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  
  .preview-btn {
    background: #555; color: #fff; border: none; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 14px;
  }
  .preview-btn:hover { background: #777; }

  @keyframes appear { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
  .new-unlock { animation: appear 0.5s ease-out; border-color: #ffd54f; }

  /* АДАПТИВ */
  @media (max-width: 1100px) {
    body { flex-direction: column; }
    .center-panel { order: 1; height: 55vh; }
    .left-panel { order: 2; width: 100%; height: 22.5vh; border-right: none; border-top: 2px solid #23352b; }
    .right-panel { order: 3; width: 100%; height: 22.5vh; border-left: none; border-top: 2px solid #23352b; }
    
    #clickBtn { width: 180px; height: 225px; }
    .score { font-size: 36px; }
    .header { top: 10px; }
    .mushroom-container { padding-top: 30px; }
    #eventBanner { top: 60px; font-size: 14px; }
    #previewBadge { top: 90px; font-size: 12px; }
    .top-controls { top: 10px; right: 10px; gap: 5px; }
    .icon-btn { width: 36px; height: 36px; font-size: 16px; }
    #bossContainer { top: 90px; }
    
    .list-container { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .item-card { min-width: 250px; max-width: 280px; }
    .item-info { max-width: 50%; }
  }
</style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div id="previewBadge">👁️ Режим примерки</div>

  <div id="bossContainer">
    <div class="boss-title">👹 ГРИБНОЙ БОСС</div>
    <div class="boss-hp-bar-bg">
      <div class="boss-hp-bar-fill" id="bossHpFill"></div>
      <div class="boss-hp-text" id="bossHpText">0 / 0</div>
    </div>
    <div id="bossTimerText">Осталось: 30с</div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <h3>Настройки</h3>
      <div class="setting-row"><span>Музыка</span><button class="toggle-btn toggle-on" id="musicToggle">Вкл</button></div>
      <div class="setting-row"><span>Звуки (Клики)</span><button class="toggle-btn toggle-on" id="sfxToggle">Вкл</button></div>
      <button class="close-modal-btn" id="closeSettings">Сохранить</button>
    </div>
  </div>

  <div class="modal-overlay" id="achModal">
    <div class="modal-content">
      <h3>Достижения (+0.5% к доходу)</h3>
      <div class="modal-scroll" id="achList"></div>
      <button class="close-modal-btn" id="closeAch">Закрыть</button>
    </div>
  </div>

  <div class="modal-overlay" id="chestModal">
    <div class="modal-content">
      <h3>Грибные Сундуки</h3>
      <div class="modal-scroll">
        <div class="chest-grid" id="chestList"></div>
      </div>
      <button class="close-modal-btn" id="closeChest">Закрыть</button>
    </div>
  </div>

  <div class="panel left-panel">
    <div class="panel-header"><h2>Гардероб</h2></div>
    <div class="list-container" id="skinListContainer"></div>
  </div>

  <div class="center-panel">
    <div id="eventBanner">
      <span id="eventText">Споровый дождь!</span>
      <span id="eventTimer">Осталось: 15с</span>
    </div>

    <div class="top-controls">
      <button class="icon-btn" id="chestBtn" title="Сундуки">🎁</button>
      <button class="icon-btn" id="achBtn" title="Достижения">🏆</button>
      <button class="icon-btn" id="fullscreenBtn" title="На весь экран">⛶</button>
      <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
    </div>

    <div class="header">
      <h1 class="score">💧 <span id="scoreVal">0</span></h1>
      <div class="stats">
        Клик: <span id="clickPowerVal">1</span> | 
        В сек: <span id="autoPowerVal">0</span> |
        Крит: <span id="critChanceVal">5%</span>
      </div>
    </div>

    <div class="mushroom-container">
      <div id="goldenDrop">💧</div>

      <button id="clickBtn">
        <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="capGrad" cx="50%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ff5252" />
              <stop offset="70%" stop-color="#d32f2f" />
              <stop offset="100%" stop-color="#8e0000" />
            </radialGradient>
            <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#dcd3b8" />
              <stop offset="50%" stop-color="#fdf6e3" />
              <stop offset="100%" stop-color="#c2b59b" />
            </linearGradient>
            
            <!-- Градиент для Золотого скина -->
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffd54f" />
              <stop offset="50%" stop-color="#ffca28" />
              <stop offset="100%" stop-color="#ff8f00" />
            </linearGradient>
            
            <!-- Градиенты для Смокинга (объем) -->
            <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#111" />
              <stop offset="30%" stop-color="#333" />
              <stop offset="50%" stop-color="#1a1a1a" />
              <stop offset="70%" stop-color="#333" />
              <stop offset="100%" stop-color="#111" />
            </linearGradient>
            <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ddd" />
              <stop offset="50%" stop-color="#fff" />
              <stop offset="100%" stop-color="#ddd" />
            </linearGradient>

            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
            </filter>
            
            <clipPath id="stemClip">
              <path d="M 70 120 Q 60 200 65 230 L 135 230 Q 140 200 130 120 Z" />
            </clipPath>

            <!-- Обрезка для шляпки -->
            <clipPath id="capClip">
              <path d="M 15 120 C 15 20 185 20 185 120 C 130 135 70 135 15 120 Z" />
            </clipPath>
          </defs>

          <!-- Базовый (Классический) -->
          <g id="baseMushroom">
            <path d="M 70 120 Q 60 200 65 230 L 135 230 Q 140 200 130 120 Z" fill="url(#stemGrad)" />
            <path d="M 75 130 Q 70 180 75 220 M 90 125 Q 85 180 90 225 M 110 125 Q 105 180 110 225 M 125 130 Q 120 180 125 220" stroke="#b0a58c" stroke-width="2" fill="none" opacity="0.5"/>
            <path d="M 30 120 Q 100 160 170 120 Q 100 140 30 120 Z" fill="#e8e2d0" />
            <path d="M 40 122 Q 100 150 160 122 M 50 126 Q 100 145 150 126 M 60 130 Q 100 140 140 130" stroke="#c2b59b" stroke-width="1.5" fill="none" />
            <path d="M 15 120 C 15 20 185 20 185 120 C 130 135 70 135 15 120 Z" fill="url(#capGrad)" filter="url(#shadow)" />
            <ellipse cx="60" cy="60" rx="15" ry="10" fill="#fff" transform="rotate(-15 60 60)" opacity="0.9"/>
            <ellipse cx="130" cy="50" rx="20" ry="12" fill="#fff" transform="rotate(20 130 50)" opacity="0.9"/>
            <ellipse cx="100" cy="80" rx="12" ry="8" fill="#fff" opacity="0.9"/>
            <ellipse cx="40" cy="95" rx="10" ry="6" fill="#fff" transform="rotate(-30 40 95)" opacity="0.8"/>
            <ellipse cx="160" cy="85" rx="14" ry="9" fill="#fff" transform="rotate(15 160 85)" opacity="0.8"/>
            <circle cx="85" cy="45" r="6" fill="#fff" opacity="0.8"/>
            <circle cx="120" cy="100" r="5" fill="#fff" opacity="0.8"/>
          </g>

          <!-- Смокинг (Переработан для объема) -->

    gain.gain.exponentialRampToValueAtTime(0.001, now + 4);
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 4);
  }

  function toggleMusic() {
    if (musicEnabled) {
      if (!isMusicPlaying) {
        isMusicPlaying = true;
        musicInterval = setInterval(playMusicNote, 1800); 
        playMusicNote(); 
      }
    } else {
      isMusicPlaying = false;
      clearInterval(musicInterval);
    }
  }

  function playSFX(type) {
    if (!sfxEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    if (type === 'click') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'crit') {
      osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'buy') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'golden' || type === 'chest') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now); osc.frequency.exponentialRampToValueAtTime(2000, now + 0.3);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'boss_hit') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    }
    osc.connect(gain); gain.connect(audioCtx.destination);
  }

  // ================= UI =================
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
    else if (document.exitFullscreen) document.exitFullscreen();

  function renderAchievements() {

  document.getElementById('buyModeBtn').addEventListener('click', () => {
    if (buyMode === 1) { buyMode = 10; document.getElementById('buyModeBtn').textContent = 'x10'; }
    else if (buyMode === 10) { buyMode = 'max'; document.getElementById('buyModeBtn').textContent = 'MAX'; }
    else { buyMode = 1; document.getElementById('buyModeBtn').textContent = 'x1'; }
    updateUI();
  });

  // ================= ЛОГИКА =================
  function saveGame() {
    const saveData = {
      score, totalEarned, totalClicks, goldenDropsCaught, totalUpgradesBought, totalTimePlayed,
      baseClickPower, equippedSkinId,
      skins: skins.map(s => ({ id: s.id, unlocked: s.unlocked })),
      upgrades: upgrades.map(u => ({ id: u.id, count: u.count })),
      achievements: achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
    };
    localStorage.setItem('mushroomRPG_Save', JSON.stringify(saveData));
  }

  function loadGame() {
    try {
      const saved = localStorage.getItem('mushroomRPG_Save');
      if (saved) {
        const data = JSON.parse(saved);
        score = data.score || 0; totalEarned = data.totalEarned || 0; totalClicks = data.totalClicks || 0;
        goldenDropsCaught = data.goldenDropsCaught || 0; totalUpgradesBought = data.totalUpgradesBought || 0;
        totalTimePlayed = data.totalTimePlayed || 0;
        baseClickPower = data.baseClickPower || 1; equippedSkinId = data.equippedSkinId || 'default';
        previewSkinId = equippedSkinId;
        
        if (data.skins) data.skins.forEach(s => { const sk = skins.find(x => x.id === s.id); if (sk) sk.unlocked = s.unlocked; });
        if (data.upgrades) data.upgrades.forEach(su => { const u = upgrades.find(x => x.id === su.id); if (u) u.count = su.count; });
        if (data.achievements) data.achievements.forEach(sa => { const a = achievements.find(x => x.id === sa.id); if (a) a.unlocked = sa.unlocked; });
      }
    } catch (e) {
      console.log("Ошибка загрузки сохранения", e);
    }
    
    applySkinFilter(equippedSkinId);
    checkUnlocks(true);
    updateUI();
    startBossTimer();
  }

  function getEquippedSkin() { return skins.find(s => s.id === equippedSkinId) || skins[0]; }

  function getAchievementBonus() {
    const unlockedCount = achievements.filter(a => a.unlocked).length;
    return 1 + (unlockedCount * 0.005);
  }

  function getCritChance() {
    const hypnoCount = upgrades.find(u => u.id === 'u8').count;
    let chance = 0.05 + (hypnoCount * 0.02) + getEquippedSkin().critBonus;
    return Math.min(chance, 1);
  }

  function getPassiveIncome() {
    let baseIncome = 0;
    upgrades.forEach(u => { baseIncome += u.count * u.baseIncome; });
    const porciniCount = upgrades.find(u => u.id === 'u2').count;
    const porciniBonus = 1 + (porciniCount * 0.05);
    const skinBonus = getEquippedSkin().passiveMult;
    const achBonus = getAchievementBonus();
    return Math.floor(baseIncome * porciniBonus * skinBonus * achBonus * eventPassiveMult * buffPassiveMult);
  }

  function getClickPower() {
    const amanitaCount = upgrades.find(u => u.id === 'u1').count;
    let base = baseClickPower + Math.floor(amanitaCount / 10);
    
    upgrades.forEach(u => {
      if (u.clickPower) {
        base += (u.count * u.clickPower);
      }
    });

    const skinBonus = getEquippedSkin().clickMult;
    const achBonus = getAchievementBonus();
    return Math.floor(base * skinBonus * achBonus * eventClickMult * buffClickMult);
  }

  function getUpgradeCost(upgrade) { return Math.floor(upgrade.baseCost * Math.pow(1.15, upgrade.count)); }
  function getBulkCost(upgrade, count) { const currentCost = getUpgradeCost(upgrade); return Math.floor(currentCost * (Math.pow(1.15, count) - 1) / 0.15); }
  function getMaxAffordable(upgrade) { const currentCost = getUpgradeCost(upgrade); if (score < currentCost) return 0; return Math.floor(Math.log(score * 0.15 / currentCost + 1) / Math.log(1.15)); }

  function formatNumber(num) {
    if (num < 1000) return Math.floor(num);
    if (num < 1000000) return (num / 1000).toFixed(1) + 'K';
    if (num < 1000000000) return (num / 1000000).toFixed(1) + 'M';
    if (num < 1000000000000) return (num / 1000000000).toFixed(1) + 'B';
    return (num / 1000000000000).toFixed(1) + 'T';
  }

  function updateUI() {
    document.getElementById('scoreVal').textContent = formatNumber(score);
    document.getElementById('clickPowerVal').textContent = formatNumber(getClickPower());
    document.getElementById('autoPowerVal').textContent = formatNumber(getPassiveIncome());
    document.getElementById('critChanceVal').textContent = Math.floor(getCritChance() * 100) + '%';

    let achUpdated = false;
    achievements.forEach(a => {
      if (!a.unlocked && a.current() >= a.target) {
        a.unlocked = true;
        achUpdated = true;
        showToast(`🏆 Достижение: ${a.name}! (+0.5% к доходу)`);
      }
    });
    if (achUpdated) { saveGame(); renderAchievements(); }

    visibleUpgrades.forEach(u => {
      const btn = document.getElementById(`btn-${u.id}`);
      if (btn) {
        let cost = getUpgradeCost(u);
        let amountToBuy = 1;

        if (buyMode === 10) {
          amountToBuy = Math.min(10, getMaxAffordable(u));
          if (amountToBuy > 0) cost = getBulkCost(u, amountToBuy);
        } else if (buyMode === 'max') {
          amountToBuy = getMaxAffordable(u);
          if (amountToBuy > 0) cost = getBulkCost(u, amountToBuy);
        }

        const costEl = document.getElementById(`cost-${u.id}`);
        const countEl = document.getElementById(`count-${u.id}`);
        
        if (amountToBuy > 0) {
            costEl.textContent = formatNumber(cost);
            countEl.textContent = `У вас: ${u.count} ${amountToBuy > 1 ? `(+${amountToBuy})` : ''}`;
        } else {
            costEl.textContent = formatNumber(getUpgradeCost(u));
            countEl.textContent = `У вас: ${u.count}`;
        }

        if (score >= (amountToBuy > 0 ? cost : getUpgradeCost(u))) { btn.className = 'item-card can-buy'; btn.disabled = false; } 
        else { btn.className = 'item-card cant-buy'; btn.disabled = true; }
      }
    });

    skins.forEach(s => {
      const btn = document.getElementById(`skinBtn-${s.id}`);
      if (btn) {
        if (!s.unlocked) { btn.textContent = `${formatNumber(s.cost)} 💧`; btn.className = 'skin-btn buy'; btn.disabled = score < s.cost; }
        else if (equippedSkinId === s.id) { btn.textContent = 'Надето'; btn.className = 'skin-btn equipped'; btn.disabled = true; }
        else { btn.textContent = 'Надеть'; btn.className = 'skin-btn equip'; btn.disabled = false; }
      }
    });
    
    if (chestModal.classList.contains('active')) renderChests();
  }

  function checkUnlocks(silent = false) {
    const container = document.getElementById('shopContainer');
    upgrades.forEach(u => {
      if (totalEarned >= u.unlockScore && !visibleUpgrades.includes(u)) {
        visibleUpgrades.push(u);
        const btn = document.createElement('button');
        btn.className = `item-card ${score >= getUpgradeCost(u) ? 'can-buy' : 'cant-buy'} new-unlock`;
        btn.id = `btn-${u.id}`;
        btn.onclick = () => buyUpgrade(u);
        btn.innerHTML = `
          <div class="item-info"><span class="item-name">${u.name}</span><span class="item-desc">${u.desc}</span></div>
          <div class="item-right"><div class="item-cost"><span id="cost-${u.id}">0</span> 💧</div><div class="item-count" id="count-${u.id}">У вас: 0</div></div>
        `;
        container.appendChild(btn);
        setTimeout(() => btn.classList.remove('new-unlock'), 1000);
      }
    });
  }

  function renderSkins() {
    const container = document.getElementById('skinListContainer');
    container.innerHTML = '';
    skins.forEach(s => {
      const div = document.createElement('div');
      div.className = `item-card ${equippedSkinId === s.id ? 'equipped' : ''} ${!s.unlocked ? 'cant-buy' : ''}`;
      div.innerHTML = `
        <div class="item-info"><span class="item-name">${s.name}</span><span class="item-desc">${s.desc}</span></div>
        <div class="item-right" style="display: flex; flex-direction: row; align-items: center; gap: 5px;">
          <button class="preview-btn" onclick="previewSkin('${s.id}')">👁️</button>
          <button class="skin-btn" id="skinBtn-${s.id}" onclick="handleSkinAction('${s.id}')">...</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  window.previewSkin = function(id) {
    const skin = skins.find(s => s.id === id);
    if (!skin) return;
    
    previewSkinId = id;
    applySkinFilter(id);
    
    const badge = document.getElementById('previewBadge');
    if (!skin.unlocked) {
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }
  };

  window.handleSkinAction = function(id) {
    const skin = skins.find(s => s.id === id);
    if (!skin) return;

    if (!skin.unlocked) {
      if (score >= skin.cost) {
        score -= skin.cost; 
        skin.unlocked = true; 
        equippedSkinId = id; 
        previewSkinId = id;
        
        document.getElementById('previewBadge').style.display = 'none';
        applySkinFilter(equippedSkinId); 
        saveGame(); 
        renderSkins(); 
        updateUI(); 
        playSFX('buy');
      }
    } else if (equippedSkinId !== id) {
      equippedSkinId = id; 
      previewSkinId = id;
      
      document.getElementById('previewBadge').style.display = 'none';
      applySkinFilter(equippedSkinId); 
      saveGame(); 
      renderSkins(); 
      updateUI(); 
      playSFX('buy');
    }
  };

  function applySkinFilter(skinId) {
    const skin = skins.find(s => s.id === skinId) || skins[0];
    const btn = document.getElementById('clickBtn');
    
    if (btn) {
      btn.className = ''; 
      btn.style.filter = 'drop-shadow(0 25px 35px rgba(0,0,0,0.6))';
    }

    document.getElementById('baseMushroom').style.display = 'none';
    document.getElementById('svgTuxedo').style.display = 'none';
    document.getElementById('svgBowtie').style.display = 'none';
    document.getElementById('svgFire').style.display = 'none';
    document.getElementById('svgIce').style.display = 'none';
    document.getElementById('svgRadio').style.display = 'none';
    document.getElementById('svgVoid').style.display = 'none';
    document.getElementById('svgHypno').style.display = 'none';
    document.getElementById('svgChanterelle').style.display = 'none';
    document.getElementById('svgToadstool').style.display = 'none';
    document.getElementById('svgGolden').style.display = 'none';

    if (skin.id === 'default') {
      document.getElementById('baseMushroom').style.display = 'block';
    } 
    else if (skin.id === 'tuxedo') {
      document.getElementById('baseMushroom').style.display = 'block';
      document.getElementById('svgTuxedo').style.display = 'block';
      document.getElementById('svgBowtie').style.display = 'block';
    } 
    else if (skin.id === 'fire') {
      document.getElementById('svgFire').style.display = 'block';
      if (btn) btn.classList.add('aura-fire');
    } 
    else if (skin.id === 'ice') {
      document.getElementById('svgIce').style.display = 'block';
      if (btn) btn.classList.add('aura-ice');
    } 
    else if (skin.id === 'radioactive') {
      document.getElementById('svgRadio').style.display = 'block';
      if (btn) btn.classList.add('aura-radio');
    } 
    else if (skin.id === 'void') {
      document.getElementById('svgVoid').style.display = 'block';
      if (btn) btn.classList.add('aura-void');
    }
    else if (skin.id === 'hypno') {
      document.getElementById('svgHypno').style.display = 'block';
      if (btn) btn.classList.add('aura-hypno');
    }
    else if (skin.id === 'chanterelle') {
      document.getElementById('svgChanterelle').style.display = 'block';
    }
    else if (skin.id === 'toadstool') {
      document.getElementById('svgToadstool').style.display = 'block';
    }
    else if (skin.id === 'golden') {
      document.getElementById('svgGolden').style.display = 'block';
      if (btn) btn.classList.add('aura-gold');
    }
  }

  function buyUpgrade(upgrade) {
    let amountToBuy = 1;
    let cost = getUpgradeCost(upgrade);
    if (buyMode === 10) { amountToBuy = Math.min(10, getMaxAffordable(upgrade)); if (amountToBuy > 0) cost = getBulkCost(upgrade, amountToBuy); } 
    else if (buyMode === 'max') { amountToBuy = getMaxAffordable(upgrade); if (amountToBuy > 0) cost = getBulkCost(upgrade, amountToBuy); }

    if (amountToBuy > 0 && score >= cost) {
      score -= cost; upgrade.count += amountToBuy; totalUpgradesBought += amountToBuy;
      updateUI(); saveGame(); playSFX('buy');
    }
  }

  // ================= СУНДУКИ =================
  function buyChest(chest) {
    if (score < chest.cost) return;
    
    score -= chest.cost;
    playSFX('chest');
    
    let rewardText = "";
    const roll = Math.random() * 100;
    
    if (roll < 50) {
      let drops = chest.cost * (1 + Math.random() * 1.5); 
      score += drops;
      rewardText = `Выпало ${formatNumber(drops)} 💧!`;
    } else if (roll < 85) {
      let duration = 30 + (Math.random() * 30); 
      let mult = 2 + (chest.cost > 10000000 ? 3 : 1); 
      buffClickMult = Math.max(buffClickMult, mult);
      rewardText = `Клик x${mult} на ${Math.floor(duration)} сек!`;
      showToast(`🎁 ${rewardText}`);
      setTimeout(() => { buffClickMult = 1; updateUI(); }, duration * 1000);
    } else {
      let duration = 30 + (Math.random() * 30);
      let mult = 2 + (chest.cost > 10000000 ? 3 : 1);
      buffPassiveMult = Math.max(buffPassiveMult, mult);
      rewardText = `Пассив x${mult} на ${Math.floor(duration)} сек!`;
      showToast(`🎁 ${rewardText}`);
      setTimeout(() => { buffPassiveMult = 1; updateUI(); }, duration * 1000);
    }

    showToast(`Открыт: ${chest.name}. ${rewardText}`);
    updateUI();
    saveGame();
  }

  // ================= БОССЫ =================
  function startBossTimer() {
    clearTimeout(bossSpawnTimeout);
    const delay = (Math.random() * 60 + 120) * 1000;
    bossSpawnTimeout = setTimeout(spawnBoss, delay);
  }

  function spawnBoss() {
    if (bossActive) return;
    bossActive = true;
    
    const baseHp = Math.max(1000, getPassiveIncome() * 30, getClickPower() * 150);
    bossMaxHp = baseHp;
    bossHp = bossMaxHp;
    
    if (baseHp < 100000) bossTimer = 30;
    else if (baseHp < 10000000) bossTimer = 45;
    else bossTimer = 60;
    
    document.getElementById('bossContainer').classList.add('active');
    updateBossUI();
    playSFX('boss_hit');

    clearInterval(bossTimerInterval);
    bossTimerInterval = setInterval(() => {
      bossTimer--;
      document.getElementById('bossTimerText').textContent = `Осталось: ${bossTimer}с`;
      
      if (bossTimer <= 0) {
        bossActive = false;
        clearInterval(bossTimerInterval);
        document.getElementById('bossContainer').classList.remove('active');
        showToast(`Босс сбежал! Не успели.`);
        startBossTimer();
      }
    }, 1000);
  }

  function damageBoss(damage) {
    if (!bossActive) return;
    bossHp -= damage;
    if (bossHp <= 0) bossHp = 0;
    updateBossUI();

    if (bossHp <= 0) {
      bossActive = false;
      clearInterval(bossTimerInterval);
      document.getElementById('bossContainer').classList.remove('active');
      
      let rewardDrops = bossMaxHp * 5;
      score += rewardDrops;
      totalEarned += rewardDrops;
      
      buffClickMult = Math.max(buffClickMult, 5);
      buffPassiveMult = Math.max(buffPassiveMult, 5);
      
      showToast(`👑 БОСС УБИТ! +${formatNumber(rewardDrops)} 💧 и ВСЁ x5 на 30 сек!`);
      
      setTimeout(() => { buffClickMult = 1; buffPassiveMult = 1; updateUI(); }, 30000);
      
      updateUI();
      saveGame();
      startBossTimer();
    }
  }

  function updateBossUI() {
    const fill = document.getElementById('bossHpFill');
    const text = document.getElementById('bossHpText');
    const percent = (bossHp / bossMaxHp) * 100;
    fill.style.width = `${percent}%`;
    text.textContent = `${formatNumber(Math.ceil(bossHp))} / ${formatNumber(bossMaxHp)}`;
  }

  // ================= ОСНОВНОЙ КЛИК =================
  function createDropEffect(x, y, isCrit = false, extraText = '') {
    const drop = document.createElement('div');
    drop.textContent = isCrit ? `💥 КРИТ x${getEquippedSkin().critMult}!` : (extraText || '💧');
    drop.style.position = 'absolute'; drop.style.left = x + 'px'; drop.style.top = y + 'px';
    drop.style.fontSize = isCrit ? '24px' : '20px'; drop.style.fontWeight = 'bold';
    drop.style.color = isCrit ? '#ffd54f' : '#4fc3f7'; drop.style.pointerEvents = 'none';
    drop.style.transition = 'all 0.8s ease-out'; drop.style.zIndex = '9999'; drop.style.textShadow = '0 2px 5px rgba(0,0,0,0.8)';
    document.body.appendChild(drop);
    setTimeout(() => { drop.style.transform = 'translate(-50%, -100px) scale(1.5)'; drop.style.opacity = '0'; }, 10);
    setTimeout(() => drop.remove(), 800);
  }

  function showToast(text) {
    const toast = document.createElement('div');
    toast.textContent = text;
    toast.style.position = 'absolute'; toast.style.top = '120px'; toast.style.left = '50%'; toast.style.transform = 'translateX(-50%)';
    toast.style.background = 'linear-gradient(135deg, #ffd54f, #f59e0b)'; toast.style.color = '#000';
    toast.style.padding = '10px 20px'; toast.style.borderRadius = '20px'; toast.style.fontWeight = 'bold';
    toast.style.zIndex = '9999'; toast.style.boxShadow = '0 5px 15px rgba(0,0,0,0.5)'; toast.style.transition = 'all 0.3s ease-out';
    toast.style.textAlign = 'center'; toast.style.maxWidth = '90%';
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.transform = 'translate(-50%, -20px)'; toast.style.opacity = '0'; }, 2500);
    setTimeout(() => toast.remove(), 3000);
  }

  document.getElementById('clickBtn').addEventListener('click', (e) => {
    if (previewSkinId !== equippedSkinId) {
      previewSkinId = equippedSkinId;
      applySkinFilter(equippedSkinId);
      document.getElementById('previewBadge').style.display = 'none';
    }

    const now = Date.now();
    if (now - lastClickTime < 35) { 
      clickStrikes++;
      if (clickStrikes > 10) {
        document.getElementById('scoreVal').textContent = "Не читери!";
        document.getElementById('scoreVal').style.color = "#ff5252";
        setTimeout(() => { document.getElementById('scoreVal').style.color = "#4fc3f7"; updateUI(); }, 1000);
        return;
      }
    } else { clickStrikes = Math.max(0, clickStrikes - 1); }
    lastClickTime = now;

    totalClicks++;
    let earned = getClickPower();
    let isCrit = Math.random() < getCritChance();
    const skin = getEquippedSkin();

    if (isCrit) { earned *= skin.critMult; playSFX('crit'); } 
    else { playSFX('click'); }

    if (bossActive) damageBoss(earned);

    let extraText = '';
    if (skin.id === 'radioactive') {
      const passiveBonus = Math.floor(getPassiveIncome() * 0.1);
      if (passiveBonus > 0) { earned += passiveBonus; extraText = `☢️ +${formatNumber(passiveBonus)}`; }
    }

    score += earned; totalEarned += earned;
    checkUnlocks(); updateUI();
    createDropEffect(e.clientX, e.clientY, isCrit, extraText);
  });

  setInterval(() => {
    totalTimePlayed++;
    const income = getPassiveIncome();
    if (income > 0) {
      score += income; totalEarned += income;
      checkUnlocks(); updateUI();
    }
  }, 1000);

  setInterval(saveGame, 10000);

  // ================= ЗОЛОТАЯ КАПЛЯ =================
  let goldenDropInterval;
  function startGoldenDropTimer() {
    clearTimeout(goldenDropInterval);
    const tuxedoCount = upgrades.find(u => u.id === 'u15').count;
    let minTime = Math.max(10, 30 - (tuxedoCount * 1.5)); 
    let maxTime = Math.max(20, 60 - (tuxedoCount * 2)); 
    const delay = Math.random() * (maxTime - minTime) + minTime;
    goldenDropInterval = setTimeout(() => showGoldenDrop(), delay * 1000);
  }

  function showGoldenDrop() {
    const dropEl = document.getElementById('goldenDrop');
    const area = document.querySelector('.mushroom-container');
    const rect = area.getBoundingClientRect();
    dropEl.style.left = Math.random() * (rect.width - 100) + 20 + 'px';
    dropEl.style.top = Math.random() * (rect.height - 100) + 20 + 'px';
    dropEl.style.display = 'block';
    playSFX('golden');
    setTimeout(() => {
      if (dropEl.style.display === 'block') { dropEl.style.display = 'none'; startGoldenDropTimer(); }
    }, 5000);
  }

  document.getElementById('goldenDrop').addEventListener('click', (e) => {
    e.stopPropagation();
    const dropEl = document.getElementById('goldenDrop');
    dropEl.style.display = 'none';

    goldenDropsCaught++;
    let reward = Math.max(getPassiveIncome() * 3, getClickPower() * 20, 100);
    const skin = getEquippedSkin();
    if (skin.id === 'ice') reward *= skin.goldenMult;

    score += reward; totalEarned += reward;
    playSFX('buy');

    const dropText = document.createElement('div');
    dropText.textContent = `+${formatNumber(reward)} 💧!`;
    dropText.style.position = 'absolute'; dropText.style.left = e.clientX + 'px'; dropText.style.top = e.clientY + 'px';
    dropText.style.fontSize = '32px'; dropText.style.fontWeight = '900'; dropText.style.color = '#ffd54f';
    dropText.style.textShadow = '0 0 15px #000'; dropText.style.pointerEvents = 'none';
    dropText.style.transition = 'all 1s ease-out'; dropText.style.zIndex = '9999';
    document.body.appendChild(dropText);
    setTimeout(() => { dropText.style.transform = 'translate(-50%, -150px) scale(1.5)'; dropText.style.opacity = '0'; }, 10);
    setTimeout(() => dropText.remove(), 1000);

    checkUnlocks(); updateUI(); saveGame(); startGoldenDropTimer(); 
  });

  // ================= ИВЕНТЫ =================
  let eventActive = false;
  let eventInterval;

  function scheduleNextEvent() {
    clearTimeout(eventInterval);
    const delay = (Math.random() * 120 + 120) * 1000; 
    eventInterval = setTimeout(triggerRandomEvent, delay);
  }

  function triggerRandomEvent() {
    if (eventActive) return;
    eventActive = true;

    const isRain = Math.random() > 0.5;
    const banner = document.getElementById('eventBanner');
    const bannerText = document.getElementById('eventText');
    const bannerTimer = document.getElementById('eventTimer');

    if (isRain) { bannerText.textContent = "🌧️ Споровый дождь! Клики x3!"; eventClickMult = 3; } 
    else { bannerText.textContent = "🌫️ Грибной туман! Пассив x2!"; eventPassiveMult = 2; }

    banner.classList.add('active');
    let timeLeft = 15;
    bannerTimer.textContent = `Осталось: ${timeLeft}с`;

    const countdown = setInterval(() => {
      timeLeft--;
      bannerTimer.textContent = `Осталось: ${timeLeft}с`;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        banner.classList.remove('active');
        eventClickMult = 1; eventPassiveMult = 1; eventActive = false;
        updateUI(); scheduleNextEvent();
      }
    }, 1000);
  }

  // ================= ЧАСТИЦЫ =================
  const pCanvas = document.getElementById('particleCanvas');
  const pCtx = pCanvas.getContext('2d');
  let particles = [];

  function resizeCanvas() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function initParticles() {
    particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * pCanvas.width, y: Math.random() * pCanvas.height,
        size: Math.random() * 3 + 1, speedX: (Math.random() - 0.5) * 0.5,
        speedY: -Math.random() * 0.5 - 0.2, opacity: Math.random() * 0.5 + 0.2,
        isFirefly: Math.random() > 0.7
      });
    }
  }
  initParticles();

  function drawParticles() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    particles.forEach(p => {
      p.x += p.speedX; p.y += p.speedY;
      if (p.isFirefly) p.x += Math.sin(Date.now() * 0.001 + p.y) * 0.5;
      if (p.y < -10) { p.y = pCanvas.height + 10; p.x = Math.random() * pCanvas.width; }
      if (p.x < -10) p.x = pCanvas.width + 10;
      if (p.x > pCanvas.width + 10) p.x = -10;

      pCtx.beginPath();
      if (p.isFirefly) {
        pCtx.fillStyle = `rgba(255, 213, 79, ${p.opacity + Math.sin(Date.now() * 0.003 + p.x) * 0.2})`;
        pCtx.shadowBlur = 10; pCtx.shadowColor = '#ffd54f';
      } else {
        pCtx.fillStyle = `rgba(165, 214, 167, ${p.opacity})`;
        pCtx.shadowBlur = 0;
      }
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); pCtx.fill();
    });
    pCtx.shadowBlur = 0;
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // ================= ЗАПУСК =================
  loadGame();
  renderSkins();
  startGoldenDropTimer();
  updateSettingsUI();
  scheduleNextEvent();
</script>
</body>
</html>
